<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANNA — DAKINICODE PHOTOGRAPHY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

max-width:100%;

overflow-x:clip;

}


body{

background:#080808;

color:white;

font-family:'Raleway',sans-serif;

overflow-x:clip;

overscroll-behavior-x:none;

width:100%;

position:relative;

padding-bottom:120px;

}



/* HEADER */

.header{

height:150px;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}


.title{

font-size:clamp(3rem,6vw,5rem);

font-weight:100;

letter-spacing:.45em;

text-transform:uppercase;

max-width:100%;

padding:0 12px;

text-align:center;

box-sizing:border-box;

text-shadow:
0 0 15px rgba(255,255,255,.25);

}



.subtitle{

margin-top:18px;

font-size:.7rem;

letter-spacing:.7em;

color:rgba(255,255,255,.4);

text-transform:uppercase;

}



/* GALLERY */

.gallery{

width:100%;

max-width:1500px;

margin:auto;

display:grid;

grid-template-columns:repeat(4,1fr);

gap:25px;

padding:0 35px;

}



.photo{

width:100%;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

border-radius:35px;

}



.photo img{

width:100%;

height:auto;

display:block;

object-fit:contain;

border-radius:35px;

}



/* FINAL HORIZONTAL PHOTO */

.horizontal{

grid-column:1 / 5;

}



.horizontal img{

width:100%;

height:auto;

object-fit:contain;

border-radius:35px;

}




/* BUTTON */

.back{

display:block;

width:max-content;

margin:120px auto 50px;

padding:15px 45px;

border:1px solid rgba(255,255,255,.35);

color:white;

text-decoration:none;

font-size:.85rem;

letter-spacing:.5em;

text-transform:uppercase;

transition:.6s;

}



.back:hover{

border-color:white;

box-shadow:

0 0 35px rgba(255,255,255,.35);

transform:translateY(-5px);

}



@media(max-width:1000px){

.gallery{

grid-template-columns:repeat(2,1fr);

padding:0 20px;

}

.horizontal{

grid-column:1 / 3;

}

}



@media(max-width:600px){

.gallery{

grid-template-columns:1fr;

}

.horizontal{

grid-column:1;

}

}

/* MOBILE ADAPTATION */

@media(max-width:768px){

.header{

height:auto;

padding:40px 20px;

}


.title{

font-size:2.3rem;

letter-spacing:.25em;

text-align:center;

}


.subtitle{

font-size:.55rem;

letter-spacing:.4em;

text-align:center;

}


.gallery{

grid-template-columns:repeat(2,1fr);

gap:18px;

padding:0 18px;

}


.photo img{

border-radius:35px;

}


.back{

margin:50px auto;

padding:14px 30px;

font-size:.7rem;

letter-spacing:.3em;

}

}



@media(max-width:480px){

.gallery{

grid-template-columns:1fr;

gap:16px;

}


.title{

font-size:2rem;

}


.subtitle{

letter-spacing:.25em;

}

}

</style>

</head>


<body>


<section class="header">


<h1 class="title">
ANNA
</h1>


<div class="subtitle">
NUDE ART SERIES
</div>


</section>




<section class="gallery">


<div class="photo">
<img src="images/web/anna/a1.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a2.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a3.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a4.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a5.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a6.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a7.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a8.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/anna/a9.jpg">
</div>


<div class="photo">

</div>


<div class="photo">

</div>


<div class="photo">

<div class="photo horizontal">

</div>


</section>

</html>
