<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALINA — DAKINICODE PHOTOGRAPHY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

max-width:100%;

overflow-x:clip;

}


body{

background:#080808;

color:white;

font-family:'Raleway',sans-serif;

overflow-x:clip;

overscroll-behavior-x:none;

width:100%;

position:relative;

padding-bottom:120px;

}


/* HEADER */

.header{

height:150px;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}


.title{

font-size:clamp(3rem,6vw,5rem);

font-weight:100;

letter-spacing:.45em;

text-transform:uppercase;

max-width:100%;

padding:0 12px;

text-align:center;

box-sizing:border-box;

text-shadow:
0 0 15px rgba(255,255,255,.25);

}



.subtitle{

margin-top:18px;

font-size:.7rem;

letter-spacing:.7em;

color:rgba(255,255,255,.4);

text-transform:uppercase;

}



/* GALLERY */

.gallery{

width:100%;

max-width:1500px;

margin:auto;

display:grid;

grid-template-columns:repeat(3,1fr);

gap:25px;

padding:0 35px;

}


.photo{

width:100%;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

border-radius:35px;

}


.photo img{

width:100%;

height:auto;

display:block;

object-fit:contain;

border-radius:35px;

}



/* LAST TWO PHOTOS */

.bottom-row{

grid-column:1 / 4;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:25px;

}


.bottom-row .photo{

width:100%;

}


.bottom-row img{

width:100%;

height:auto;

display:block;

object-fit:contain;

border-radius:35px;

}


/* BUTTON */

.back{

display:block;

width:max-content;

margin:120px auto 50px;

padding:15px 45px;

border:1px solid rgba(255,255,255,.35);

color:white;

text-decoration:none;

font-size:.85rem;

letter-spacing:.5em;

text-transform:uppercase;

transition:.6s;

}
.back:hover{

border-color:white;

box-shadow:

0 0 35px rgba(255,255,255,.35);

transform:translateY(-5px);

}




/* VIDEO */

.video-section{

width:100%;

max-width:1500px;

margin:100px auto 0;

padding:0 35px;

}


.video-section video{

width:100%;

height:auto;

display:block;

border-radius:35px;

object-fit:contain;

}



/* YOUTUBE BUTTON */

.youtube-link{

text-align:center;

margin-top:35px;

}


.youtube-link a{

display:inline-block;

padding:14px 40px;

border:1px solid rgba(255,255,255,.35);

color:white;

text-decoration:none;

font-size:.75rem;

letter-spacing:.4em;

text-transform:uppercase;

transition:.6s;

}


.youtube-link a:hover{

border-color:white;

box-shadow:

0 0 35px rgba(255,255,255,.35);

transform:translateY(-5px);

}




/* TABLET */

@media(max-width:900px){

.gallery{

grid-template-columns:repeat(2,1fr);

padding:0 20px;

}


.bottom-row{

grid-column:1 / 3;

}

}



/* MOBILE */

@media(max-width:768px){


.header{

height:auto;

padding:40px 20px;

}



.title{

font-size:2.3rem;

letter-spacing:.25em;

text-align:center;

}



.subtitle{

font-size:.55rem;

letter-spacing:.4em;

text-align:center;

}



.gallery{

grid-template-columns:repeat(2,1fr);

gap:18px;

padding:0 18px;

}



.bottom-row{

grid-column:1 / 3;

grid-template-columns:repeat(2,1fr);

gap:18px;

}



.photo{

border-radius:35px;

}



.photo img{

border-radius:35px;

}



.bottom-row img{

border-radius:35px;

}



.video-section{

padding:0 18px;

margin-top:60px;

}


.video-section video{

border-radius:25px;

}



.youtube-link{

margin-top:25px;

}


.youtube-link a{

padding:12px 25px;

font-size:.65rem;

letter-spacing:.25em;

}



.back{

margin:50px auto;

padding:14px 30px;

font-size:.7rem;

letter-spacing:.3em;

}

}



@media(max-width:480px){


.gallery{

grid-template-columns:1fr;

gap:16px;

}



.bottom-row{

grid-column:1;

grid-template-columns:1fr;

}



.title{

font-size:2rem;

}



.subtitle{

letter-spacing:.25em;

}



}

</style>

</head>

<body>


<section class="header">


<h1 class="title">

ALINA

</h1>


<div class="subtitle">

IDENTITY PROJECT

</div>


</section>




<section class="gallery">



<div class="photo">
<img src="images/web/alina/c1.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/alina/c2.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/alina/c3.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/alina/c4.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/alina/c5.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/alina/c6.jpg">
</div>




<div class="bottom-row">


<div class="photo">
<img loading="lazy" src="images/web/alina/c7.jpg">
</div>


<div class="photo">
<img loading="lazy" src="images/web/alina/c8.jpg">
</div>


</div>



</section>




<section class="video-section">

<video 
src="images/web/alina/burningsea.mp4"
autoplay
muted
loop
playsinline>
</video>

</section>




<div class="youtube-link">

<a href="https://www.youtube.com/watch?v=mjwXN_AJmvw" target="_blank">
WATCH ON YOUTUBE
</a>

</div>




<a href="portfolio.html" class="back">

BACK TO PORTFOLIO

</a>




</body>

</html>
