<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAKINICODE PHOTOGRAPHY — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;
max-width:100%;
overflow-x:clip;

}


body{

background:#080808;

color:white;

font-family:'Raleway',sans-serif;

overflow:hidden;

overscroll-behavior-x:none;

}



/* PAGE */

.portfolio-page{

height:100vh;

display:flex;

flex-direction:column;

justify-content:flex-start;

align-items:center;

position:relative;

}



/* SERIES */

.series-container{

width:90%;

max-width:1400px;

display:flex;

justify-content:center;

align-items:flex-start;

gap:45px;

padding-top:45px;

}



.series{

width:32%;

text-align:center;

position:relative;

}



/* LIGHT */

.series::before{

content:"";

position:absolute;

width:190%;

height:190%;

left:-45%;

top:-40%;


background:

radial-gradient(

ellipse,

rgba(255,255,255,.12),

rgba(130,130,150,.04),

rgba(0,0,0,0)

65%

);


filter:blur(70px);

z-index:-1;

animation:cosmicGlow 8s ease-in-out infinite;

}



@keyframes cosmicGlow{

0%,100%{

transform:scale(.95);

opacity:.55;

}


50%{

transform:scale(1.08);

opacity:.85;

}

}



/* IMAGE */


.image-box{

height:62vh;

display:flex;

align-items:center;

justify-content:center;

position:relative;

overflow:visible;

}



.image-box::after{

content:"";

position:absolute;

inset:-40px;


background:

radial-gradient(

circle,

rgba(255,255,255,.16),

rgba(0,0,0,0)

70%

);


filter:blur(45px);

z-index:-1;

}




.image-box img{

max-width:100%;

max-height:100%;

width:auto;

height:auto;


object-fit:contain;


border-radius:18px;


filter:

brightness(.92)

contrast(1.05)

saturate(.92)

drop-shadow(
0 0 40px rgba(255,255,255,.3)
);


transition:2s ease;

}



.series:hover img{


transform:scale(1.03);


filter:

brightness(1)

contrast(1.1)

drop-shadow(
0 0 60px rgba(255,255,255,.4)
);


}




/* TEXT */


.series h2{

margin-top:30px;

font-size:1.3rem;

font-weight:100;

letter-spacing:.65em;

text-transform:uppercase;

}



.series p{

margin-top:15px;

font-size:.65rem;

letter-spacing:.5em;

color:rgba(255,255,255,.4);

text-transform:uppercase;

}



/* BACK */


.back{

position:absolute;

bottom:45px;

left:50%;

transform:translateX(-50%);


padding:15px 45px;


border:1px solid rgba(255,255,255,.35);


color:white;


text-decoration:none;


font-size:.85rem;


letter-spacing:.5em;


text-transform:uppercase;


transition:.6s;

}



.back:hover{

box-shadow:

0 0 35px rgba(255,255,255,.35);

border-color:white;


transform:

translateX(-50%)

translateY(-5px);

}


/* MOBILE ADAPTATION */

@media(max-width:768px){

html,body{

overflow-x:clip;

max-width:100%;

overscroll-behavior-x:none;

touch-action:pan-y;

}


body{

overflow-y:auto;

overflow-x:clip;

}


.portfolio-page{

height:auto;

padding:30px 0 120px;

max-width:100%;

overflow-x:clip;

}


.series-container{

width:min(92%,420px);

max-width:100%;

flex-direction:column;

align-items:center;

gap:50px;

padding-top:30px;

overflow:visible;

}


.series{

width:100%;

max-width:420px;

overflow:visible;

}


.series::before{

display:block;

width:160%;

height:160%;

left:-30%;

top:-30%;

opacity:.7;

filter:blur(55px);

}


.image-box::after{

display:block;

inset:-28px;

filter:blur(40px);

}


.image-box{

height:auto;

overflow:visible;

}


.image-box img{

width:100%;

height:auto;

border-radius:22px;

filter:

brightness(.95)

contrast(1.05)

saturate(.92)

drop-shadow(0 0 36px rgba(255,255,255,.28));

}


.series:hover img{

transform:none;

filter:

brightness(.97)

contrast(1.06)

saturate(.93)

drop-shadow(0 0 48px rgba(255,255,255,.34));

}


.series h2{

margin-top:20px;

font-size:1.1rem;

letter-spacing:.45em;

}


.series p{

font-size:.6rem;

letter-spacing:.35em;

}


.back{

position:relative;

left:auto;

bottom:auto;

transform:none;

margin-top:50px;

}


.back:hover{

transform:translateY(-5px);

}

}



@media(max-width:420px){

.series h2{

font-size:1rem;

letter-spacing:.35em;

}


.series p{

letter-spacing:.25em;

}

}

</style>


</head>


<body>

</div>

</a>

</h2>


<p>

</p>


</div>

<div class="series">


<a href="tim.html">

<div class="image-box">

<img src="images/web/tim/m1.jpg" alt="Tim" loading="eager" decoding="async">

</div>

</a>


<h2>
TIM
</h2>


<p>

</p>


</div>



</section>

BACK
</a>



</div>


</body>

</html>
